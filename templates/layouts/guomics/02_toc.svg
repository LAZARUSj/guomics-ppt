<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#004791"/>
            <stop offset="100%" stop-color="#002D5C"/>
        </linearGradient>
    </defs>

    <!-- Background: white left panel + navy right panel + orange transition -->
    <image href="../assets/toc_bg.jpg" x="0" y="0" width="1280" height="720"
           preserveAspectRatio="none"/>

    <!-- Bottom-left corner branding -->
    <image href="../assets/corner_orange_l.png" x="43" y="652" width="53" height="52"/>
    <image href="../assets/corner_text_l.png"   x="113" y="657" width="62" height="42"/>

    <!-- Left white panel: section label + decorative line -->
    <text x="160" y="290" font-family="Arial Black" font-size="40"
          fill="url(#titleGrad)" text-anchor="middle">{{SECTION_LABEL}}</text>
    <rect x="90" y="310" width="145" height="3" fill="#F18D00"/>
    <text x="160" y="345" font-family="Arial" font-size="14"
          fill="#666666" text-anchor="middle">CONTENTS</text>

    <!-- Right navy panel: 6 numbered items with dividers -->
    <text x="385" y="195" font-family="Arial Black" font-size="18" fill="#F18D00">01</text>
    <text x="420" y="195" font-family="Arial" font-size="18" fill="#FFFFFF">{{ITEM_1}}</text>
    <rect x="380" y="203" width="720" height="1" fill="#FFFFFF" fill-opacity="0.15"/>

    <text x="385" y="280" font-family="Arial Black" font-size="18" fill="#F18D00">02</text>
    <text x="420" y="280" font-family="Arial" font-size="18" fill="#FFFFFF">{{ITEM_2}}</text>
    <rect x="380" y="288" width="720" height="1" fill="#FFFFFF" fill-opacity="0.15"/>

    <text x="385" y="365" font-family="Arial Black" font-size="18" fill="#F18D00">03</text>
    <text x="420" y="365" font-family="Arial" font-size="18" fill="#FFFFFF">{{ITEM_3}}</text>
    <rect x="380" y="373" width="720" height="1" fill="#FFFFFF" fill-opacity="0.15"/>

    <text x="385" y="450" font-family="Arial Black" font-size="18" fill="#F18D00">04</text>
    <text x="420" y="450" font-family="Arial" font-size="18" fill="#FFFFFF">{{ITEM_4}}</text>
    <rect x="380" y="458" width="720" height="1" fill="#FFFFFF" fill-opacity="0.15"/>

    <text x="385" y="535" font-family="Arial Black" font-size="18" fill="#F18D00">05</text>
    <text x="420" y="535" font-family="Arial" font-size="18" fill="#FFFFFF">{{ITEM_5}}</text>
    <rect x="380" y="543" width="720" height="1" fill="#FFFFFF" fill-opacity="0.15"/>

    <text x="385" y="620" font-family="Arial Black" font-size="18" fill="#F18D00">06</text>
    <text x="420" y="620" font-family="Arial" font-size="18" fill="#FFFFFF">{{ITEM_6}}</text>

    <!-- Bottom-right Guomics 2026 branding -->
    <text x="1224" y="708" font-family="Arial" font-size="11"
          fill="#FFFFFF" text-anchor="end">Guomics 2026</text>
</svg>
