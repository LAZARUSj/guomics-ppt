<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#D0D8E8"/>
        </linearGradient>
    </defs>

    <!-- White full-page base -->
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <!-- Navy left 2/3 panel -->
    <rect x="0" y="0" width="855" height="720" fill="#004791"/>
    <!-- Orange transition strip -->
    <rect x="850" y="0" width="10" height="720" fill="#F18D00"/>

    <!-- Top-right corner logos (in white right panel) -->
    <image href="../assets/westlake_logo_r.png" x="1076" y="16" width="53" height="52"/>
    <image href="../assets/guomics_emblem_r.png" x="1146" y="21" width="60" height="42"/>

    <!-- Title bar (white text on navy) -->
    <text x="63" y="60" font-family="Arial Black" font-size="28" fill="url(#titleGrad)">{{SLIDE_TITLE}}</text>
    <rect x="60" y="76" width="740" height="3" fill="#F18D00"/>

    <!-- Left bullets: card-style on navy background -->
    <!-- Card 1 -->
    <rect x="60" y="105" width="770" height="88" rx="6" fill="#003566" fill-opacity="0.5" stroke="#1A5A8A" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="105" width="4" height="88" rx="2" fill="#F18D00"/>
    <circle cx="80" cy="136" r="4" fill="#F18D00"/>
    <text x="94" y="142" font-family="Arial" font-size="18" fill="#FFFFFF">{{BULLET_1}}</text>
    <text x="105" y="168" font-family="Arial" font-size="15" fill="#AACCEE">{{BULLET_1_SUB}}</text>

    <!-- Card 2 -->
    <rect x="60" y="213" width="770" height="88" rx="6" fill="#003566" fill-opacity="0.5" stroke="#1A5A8A" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="213" width="4" height="88" rx="2" fill="#F18D00"/>
    <circle cx="80" cy="244" r="4" fill="#F18D00"/>
    <text x="94" y="250" font-family="Arial" font-size="18" fill="#FFFFFF">{{BULLET_2}}</text>
    <text x="105" y="276" font-family="Arial" font-size="15" fill="#AACCEE">{{BULLET_2_SUB}}</text>

    <!-- Card 3 -->
    <rect x="60" y="321" width="770" height="88" rx="6" fill="#003566" fill-opacity="0.5" stroke="#1A5A8A" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="321" width="4" height="88" rx="2" fill="#F18D00"/>
    <circle cx="80" cy="352" r="4" fill="#F18D00"/>
    <text x="94" y="358" font-family="Arial" font-size="18" fill="#FFFFFF">{{BULLET_3}}</text>
    <text x="105" y="384" font-family="Arial" font-size="15" fill="#AACCEE">{{BULLET_3_SUB}}</text>

    <!-- Card 4 -->
    <rect x="60" y="429" width="770" height="88" rx="6" fill="#003566" fill-opacity="0.5" stroke="#1A5A8A" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="60" y="429" width="4" height="88" rx="2" fill="#F18D00"/>
    <circle cx="80" cy="460" r="4" fill="#F18D00"/>
    <text x="94" y="466" font-family="Arial" font-size="18" fill="#FFFFFF">{{BULLET_4}}</text>
    <text x="105" y="492" font-family="Arial" font-size="15" fill="#AACCEE">{{BULLET_4_SUB}}</text>

    <!-- Right figure zone (white panel, styled card) -->
    <rect x="875" y="88" width="350" height="520" rx="10" fill="#FFFFFF" stroke="#E0E4E8" stroke-width="1"/>
    <rect x="875" y="88" width="350" height="4" rx="2" fill="#004791" fill-opacity="0.3"/>
    <text x="1050" y="360" font-family="Arial" font-size="14" fill="#999999"
          text-anchor="middle">{{FIGURE_LABEL}}</text>

    <!-- Page number -->
    <text x="1215" y="705" font-family="Arial" font-size="11" fill="#212121"
          text-anchor="end">{{PAGE_NUM}}</text>

    <!-- Bottom-right Guomics 2026 branding -->
    <text x="1224" y="708" font-family="Arial" font-size="11"
          fill="#212121" text-anchor="end">Guomics 2026</text>
</svg>
