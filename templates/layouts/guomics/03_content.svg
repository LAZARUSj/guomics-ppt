<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#002D5C"/>
            <stop offset="100%" stop-color="#004791"/>
        </linearGradient>
    </defs>

    <!-- Background: orange TL arc + navy BR arc + white center -->
    <image href="../assets/cover_bg.jpg" x="0" y="0" width="1280" height="720"
           preserveAspectRatio="none"/>

    <!-- Top-right corner logos: Westlake University + Guomics emblem -->
    <image href="../assets/westlake_logo_r.png" x="1076" y="16" width="53" height="52"/>
    <image href="../assets/guomics_emblem_r.png" x="1146" y="21" width="60" height="42"/>

    <!-- Title bar -->
    <text x="60" y="60" font-family="Arial Black" font-size="28" fill="url(#titleGrad)">{{SLIDE_TITLE}}</text>
    <rect x="60" y="76" width="1160" height="3" fill="#F18D00"/>

    <!-- Left text zone: 4 card-style bullets -->
    <!-- Card 1 -->
    <rect x="60" y="110" width="570" height="82" rx="6" fill="#F8FAFC" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="60" y="110" width="4" height="82" rx="2" fill="#F18D00"/>
    <circle cx="82" cy="137" r="4" fill="#F18D00"/>
    <text x="96" y="143" font-family="Arial" font-size="17" fill="#212121">{{BULLET_1}}</text>
    <text x="96" y="168" font-family="Arial" font-size="14" fill="#666666">{{BULLET_1_SUB}}</text>

    <!-- Card 2 -->
    <rect x="60" y="207" width="570" height="82" rx="6" fill="#F8FAFC" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="60" y="207" width="4" height="82" rx="2" fill="#F18D00"/>
    <circle cx="82" cy="234" r="4" fill="#F18D00"/>
    <text x="96" y="240" font-family="Arial" font-size="17" fill="#212121">{{BULLET_2}}</text>
    <text x="96" y="265" font-family="Arial" font-size="14" fill="#666666">{{BULLET_2_SUB}}</text>

    <!-- Card 3 -->
    <rect x="60" y="304" width="570" height="82" rx="6" fill="#F8FAFC" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="60" y="304" width="4" height="82" rx="2" fill="#F18D00"/>
    <circle cx="82" cy="331" r="4" fill="#F18D00"/>
    <text x="96" y="337" font-family="Arial" font-size="17" fill="#212121">{{BULLET_3}}</text>
    <text x="96" y="362" font-family="Arial" font-size="14" fill="#666666">{{BULLET_3_SUB}}</text>

    <!-- Card 4 -->
    <rect x="60" y="401" width="570" height="82" rx="6" fill="#F8FAFC" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="60" y="401" width="4" height="82" rx="2" fill="#F18D00"/>
    <circle cx="82" cy="428" r="4" fill="#F18D00"/>
    <text x="96" y="434" font-family="Arial" font-size="17" fill="#212121">{{BULLET_4}}</text>
    <text x="96" y="459" font-family="Arial" font-size="14" fill="#666666">{{BULLET_4_SUB}}</text>

    <!-- Right figure zone (styled card) -->
    <rect x="650" y="110" width="565" height="490" rx="10" fill="#FFFFFF" stroke="#E0E4E8" stroke-width="1"/>
    <rect x="650" y="110" width="565" height="4" rx="2" fill="#F18D00" fill-opacity="0.5"/>
    <text x="932" y="355" font-family="Arial" font-size="14" fill="#999999"
          text-anchor="middle">{{FIGURE_LABEL}}</text>

    <!-- Page number bottom-right -->
    <text x="1215" y="705" font-family="Arial" font-size="11" fill="#666666"
          text-anchor="end">{{PAGE_NUM}}</text>

    <!-- Bottom-right Guomics 2026 branding -->
    <text x="1224" y="708" font-family="Arial" font-size="11"
          fill="#FFFFFF" text-anchor="end">Guomics 2026</text>
</svg>
